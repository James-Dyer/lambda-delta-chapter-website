name: External Links Test

on:
  workflow_dispatch:

jobs:
  test-external-links:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run external links test
        run: npm test -- src/__tests__/ExternalLinks.test.js
